name: Validate Theoria
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm install --prefix functions --no-audit --no-fund
      - run: npx firebase-tools emulators:exec --only firestore --project demo-theoria "npm test"
  windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell deployment script syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @('scripts/deploy-theoria-backend.ps1', 'scripts/skip-unused-extensions-check.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
  node24-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm install --prefix functions --no-audit --no-fund
      - run: npm --prefix functions run check
      - run: npx firebase-tools emulators:exec --only firestore --project demo-theoria "npm test"
